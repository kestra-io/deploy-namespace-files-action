name: 'Kestra Deploy Namespace Files Action'
description: 'Deploy Namespace Files from a folder'
branding:
  icon: 'upload-cloud'
  color: 'blue'
inputs:
  localPath:
    description: 'path to your file or directory containing your files'
    default: './'
  namespacePath:
    description: 'remote Namespace path to deploy your files to (if localPath is a file, then namespacePath should be a file too)'
    required: true
  namespace:
    description: 'Namespace to deploy files to'
    required: true
  override:
    description: 'to override files if they already exist or not'
    default: 'false'
  server:
    description: 'URL of your Kestra server'
    required: true
  apiToken:
    description: 'API Token (EE only)'
    required: false
  user:
    description: 'basic auth username'
    required: false
  password:
    description: 'basic auth password'
    required: false
  tenant:
    description: 'Tenant identifier (EE only, when multi-tenancy is enabled)'
    default: "main"
    required: true
  kestractlVersion:
    description: "version of kestractl (see https://github.com/kestra-io/kestractl)"
    default: 'latest'
runs:
  using: "composite"
  steps:
    - name: Install CLI
      shell: bash
      env:
        VERSION: ${{ inputs.kestractlVersion }}
        INSTALL_DIR: ./
      run: |
        curl -fsSL -o "$RUNNER_TEMP/kestractl-install.sh" https://raw.githubusercontent.com/kestra-io/kestractl/main/install-scripts/install.sh
        bash "$RUNNER_TEMP/kestractl-install.sh"

    - name: Run CLI
      shell: bash
      env:
        # indicate in telemetry that kestractl was called from our action
        KESTRACTL_GITHUB_ACTION: "true"
        INPUT_NAMESPACE: ${{ inputs.namespace }}
        INPUT_LOCAL_PATH: ${{ inputs.localPath }}
        INPUT_NAMESPACE_PATH: ${{ inputs.namespacePath }}
        INPUT_OVERRIDE: ${{ inputs.override }}
        INPUT_API_TOKEN: ${{ inputs.apiToken }}
        INPUT_USER: ${{ inputs.user }}
        INPUT_PASSWORD: ${{ inputs.password }}
        INPUT_SERVER: ${{ inputs.server }}
        INPUT_TENANT: ${{ inputs.tenant }}
      run: |
        OPTS=""
        if [ "$INPUT_OVERRIDE" = "true" ]; then
          OPTS="$OPTS --override"
        fi
        if [ -n "$INPUT_API_TOKEN" ]; then
          OPTS="$OPTS --token $INPUT_API_TOKEN"
        elif [ -n "$INPUT_USER" ] && [ -n "$INPUT_PASSWORD" ]; then
          OPTS="$OPTS --username $INPUT_USER --password $INPUT_PASSWORD"
        fi
        ./kestractl nsfiles upload $INPUT_NAMESPACE $INPUT_LOCAL_PATH $INPUT_NAMESPACE_PATH --host $INPUT_SERVER --tenant $INPUT_TENANT $OPTS
